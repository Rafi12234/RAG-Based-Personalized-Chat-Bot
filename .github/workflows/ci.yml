name: Phase 1 checks
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: exampleRootPassword
          MYSQL_DATABASE: docmind_ai
          MYSQL_USER: docmind_app
          MYSQL_PASSWORD: example
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pexampleRootPassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://docmind_app:example@127.0.0.1:3307/docmind_ai
      SHADOW_DATABASE_URL: mysql://docmind_app:example@127.0.0.1:3307/docmind_ai_shadow
      NODE_ENV: test
      FRONTEND_URL: http://localhost:5173
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3307
      DATABASE_USER: docmind_app
      DATABASE_PASSWORD: example
      DATABASE_NAME: docmind_ai
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: docmind-documents
      S3_ACCESS_KEY: example
      S3_SECRET_KEY: example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: cd backend && npm ci
      - name: Generate Prisma client
        run: cd backend && npx prisma generate
      - name: Validate Prisma schema
        run: cd backend && npx prisma validate
      - name: Apply database migrations
        run: cd backend && npx prisma migrate deploy
      - name: Check backend and integration tests
        run: cd backend && npm run typecheck && npm run build && npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check React app
        run: cd frontend && npm ci && npm run lint && npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax-check Python worker
        run: python -m compileall -q python-worker/worker
