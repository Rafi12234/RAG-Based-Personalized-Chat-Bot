name: Phase 1 checks
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mysql://docmind_app:example@127.0.0.1:3307/docmind_ai
      SHADOW_DATABASE_URL: mysql://docmind_app:example@127.0.0.1:3307/docmind_ai_shadow
      NODE_ENV: test
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3307
      DATABASE_USER: docmind_app
      DATABASE_PASSWORD: example
      DATABASE_NAME: docmind_ai
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: docmind-documents
      S3_ACCESS_KEY: example
      S3_SECRET_KEY: example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # The patch ships package.json only; npm install regenerates the lockfile.
      # Once backend/package-lock.json is committed, switch to npm ci.
      - name: Install dependencies
        run: cd backend && npm install
      - name: Generate Prisma client
        run: cd backend && npx prisma generate
      - name: Validate Prisma schema
        run: cd backend && npx prisma validate
      - name: Check backend
        run: cd backend && npm run typecheck && npm run build && npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build React app
        run: cd frontend && npm ci && npm run build

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax-check Python worker
        run: python -m compileall -q python-worker/worker
