name: DocMind CI - Phase 1 through Phase 3
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: exampleRootPassword
          MYSQL_DATABASE: docmind_ai
          MYSQL_USER: docmind_app
          MYSQL_PASSWORD: example
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pexampleRootPassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL: mysql://docmind_app:example@127.0.0.1:3307/docmind_ai
      SHADOW_DATABASE_URL: mysql://docmind_app:example@127.0.0.1:3307/docmind_ai_shadow
      NODE_ENV: test
      FRONTEND_URL: http://localhost:5173
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: 3307
      DATABASE_USER: docmind_app
      DATABASE_PASSWORD: example
      DATABASE_NAME: docmind_ai
      S3_ENDPOINT: http://127.0.0.1:9000
      S3_REGION: us-east-1
      S3_BUCKET: docmind-documents
      S3_ACCESS_KEY: example
      S3_SECRET_KEY: example
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: cd backend && npm ci
      - name: Generate Prisma client
        run: cd backend && npx prisma generate
      - name: Validate Prisma schema
        run: cd backend && npx prisma validate
      - name: Apply database migrations
        run: cd backend && npx prisma migrate deploy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Phase 4.3E isolated MySQL provenance and reader integration
        working-directory: python-worker
        env:
          DOCMIND_SHADOW_SQL_CI: 'YES'
        run: |
          python -m pip install 'PyMySQL>=1.1,<2.0' 'PyMuPDF>=1.24,<2.0' 'python-docx>=1.1,<2.0' 'cryptography>=43,<47'
          python -m unittest -v worker.test_shadow_reader_sql
      - name: Check backend and integration tests
        run: cd backend && npm run typecheck && npm run build && npm test
      - name: Phase 3.9 and 3.10 offline RAG security and grounding regressions
        run: cd backend && npm run test:phase3

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Check React app
        run: cd frontend && npm ci && npm run lint && npm run build
      - name: Validate frozen Phase 4.1 holdout harness
        run: |
          node --check tools/PHASE4_1_HOLDOUT_READ_ONLY.js
          node -e 'const m=require("./quality-fixtures/phase4_1_question_holdout_v1.json"); if(m.cases.length!==12 || new Set(m.cases.map(c=>c.id)).size!==12 || m.cases.some(c=>!["answered","insufficient_evidence"].includes(c.expectedStatus))) process.exit(1)'

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax-check Python worker
        run: python -m compileall -q python-worker/worker
      - name: Install Phase 4.2 extraction test dependencies
        working-directory: python-worker
        run: python -m pip install "PyMuPDF>=1.24,<2.0" "python-docx>=1.1,<2.0" "boto3>=1.35,<2.0" "PyMySQL>=1.1,<2.0" "python-dotenv>=1.0,<2.0" "cryptography>=43,<47"
      - name: Guarded automatic ingestion unit tests
        working-directory: python-worker
        run: python -m unittest worker.test_docx_table_rows worker.test_auto_ingestion_service worker.test_large_document_shards worker.test_remote_document_shards worker.test_live_ingestion_worker
      - name: Phase 4.2 PDF OCR and DOCX extraction regression
        working-directory: python-worker
        run: python -m unittest worker.test_document_ocr worker.test_document_extraction
      - name: Phase 4.2C structure extraction and large-version recovery audit tests
        working-directory: python-worker
        run: python -m unittest worker.test_document_structure worker.test_large_vector_audit worker.test_large_publication_probe
      - name: Phase 4.3A hierarchical passages and isolated shadow-index staging
        working-directory: python-worker
        run: python -m unittest worker.test_hierarchical_index worker.test_hierarchical_shadow
      - name: Phase 4.3B encrypted manifests and read-only shadow integrity audit
        working-directory: python-worker
        run: python -m unittest worker.test_hierarchy_manifest_store worker.test_hierarchy_shadow_audit
      - name: Phase 4.3C full E5 vector fidelity and revocable candidate registry
        working-directory: python-worker
        run: python -m unittest worker.test_hierarchy_vector_fidelity worker.test_hierarchy_generation_registry
      - name: Phase 4.1 offline AI quality evaluator unit tests
        working-directory: python-worker
        run: python -m unittest worker.test_phase4_ai_quality worker.test_phase3_retrieval_quality
      - name: Phase 4.3D local pinned model reference tests
        working-directory: python-worker
        run: |
          python -m pip install 'numpy>=1.26,<3' 'onnxruntime>=1.20,<2' 'tokenizers>=0.20,<1' 'onnx>=1.17,<2'
          python -c 'import numpy, onnx, onnxruntime, tokenizers'
          python -m unittest -v worker.test_pinned_e5
      - name: Phase 4.3E permission-fenced shadow reader tests
        working-directory: python-worker
        run: python -m unittest -v worker.test_shadow_reader
      - name: Phase 4.4–4.7 advanced retrieval and grounding regressions
        working-directory: python-worker
        run: python -m unittest -v worker.test_advanced_rag worker.test_local_pair_model
      - name: Phase 4.8 500, 2000 and 5000-page native PDF scale smoke
        working-directory: python-worker
        run: python -m worker.advanced_scale_smoke
